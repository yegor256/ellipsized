---
name: yamllint
'on':
  push:
    branches:
      - master
    paths:
      - '**.yml'
      - '**.yaml'
  pull_request:
    branches:
      - master
    paths:
      - '**.yml'
      - '**.yaml'
jobs:
  yamllint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ibiqlik/action-yamllint@v3
