---
AllCops:
  Exclude:
    - 'bin/**/*'
    - 'assets/**/*'
    - 'vendor/**/*'
  DisplayCopNames: true
  TargetRubyVersion: 3.2
  SuggestExtensions: false
  NewCops: enable
plugins:
  - rubocop-rake
  - rubocop-minitest
  - rubocop-performance
  - rubocop-elegant
Layout/EndOfLine:
  EnforcedStyle: lf
Style/EvalWithLocation:
  Enabled: false
Metrics/AbcSize:
  Max: 50
Metrics/ClassLength:
  Max: 150
Metrics/CyclomaticComplexity:
  Max: 22
Metrics/PerceivedComplexity:
  Max: 18
Metrics/MethodLength:
  Max: 38
Minitest/EmptyLineBeforeAssertionMethods:
  Enabled: false
Elegant/ClassInModule:
  Exclude:
    - 'lib/**/*'
    - '**/test_*.rb'
    - '**/*Test.rb'
